services:
  db:
    image: postgres:15-alpine
    container_name: hemc_postgres
    environment:
      POSTGRES_USER: hemc_user
      POSTGRES_PASSWORD: hemc_password
      POSTGRES_DB: hemc_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: hemc_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
